<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>月满中秋 · 烟花送福</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #060818;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    touch-action: manipulation;
    user-select: none;
  }
  #scene { position: fixed; inset: 0; display: block; }

  /* ---------- 标题 ---------- */
  #title {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 7%);
    left: 0; right: 0;
    text-align: center;
    color: #fff7e6;
    pointer-events: none;
    transition: opacity 1.2s ease;
    z-index: 5;
  }
  #title h1 {
    font-size: clamp(22px, 6vw, 34px);
    font-weight: 500;
    letter-spacing: .35em;
    text-indent: .35em;
    text-shadow: 0 0 18px rgba(255, 220, 150, .55), 0 2px 8px rgba(0,0,0,.6);
  }
  #title p {
    margin-top: 10px;
    font-size: clamp(12px, 3.4vw, 15px);
    letter-spacing: .5em;
    text-indent: .5em;
    color: rgba(255, 240, 210, .75);
  }

  /* ---------- 底部按钮区 ---------- */
  #controls {
    position: fixed;
    left: 0; right: 0;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 9%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    z-index: 6;
    transition: opacity .6s ease, transform .6s ease;
  }
  #controls.hidden { opacity: 0; transform: translateY(30px); pointer-events: none; }

  #launchBtn {
    border: none;
    outline: none;
    cursor: pointer;
    padding: 15px 46px;
    font-size: clamp(17px, 4.6vw, 21px);
    letter-spacing: .28em;
    text-indent: .28em;
    font-weight: 600;
    color: #5a2b00;
    background: linear-gradient(160deg, #ffe9b8, #ffc966 55%, #ffab3d);
    border-radius: 999px;
    box-shadow: 0 0 26px rgba(255, 190, 90, .55), 0 6px 18px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.7);
    animation: breathe 2.4s ease-in-out infinite;
    transition: transform .15s ease;
  }
  #launchBtn:active { transform: scale(.94); }
  @keyframes breathe {
    0%, 100% { box-shadow: 0 0 18px rgba(255,190,90,.4), 0 6px 18px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.7); }
    50%      { box-shadow: 0 0 36px rgba(255,205,110,.85), 0 6px 18px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.7); }
  }

  /* 三种烟花选择 */
  #picker {
    display: flex;
    gap: 12px;
    max-height: 0;
    opacity: 0;
    overflow: hidden;
    transform: translateY(16px);
    transition: max-height .55s cubic-bezier(.22,1,.36,1), opacity .45s ease, transform .55s cubic-bezier(.22,1,.36,1);
  }
  #picker.open { max-height: 120px; opacity: 1; transform: translateY(0); }
  .fw-btn {
    border: 1px solid rgba(255,255,255,.28);
    cursor: pointer;
    padding: 12px 10px;
    min-width: 88px;
    border-radius: 18px;
    background: rgba(15, 18, 45, .55);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    transition: transform .15s ease, background .3s ease;
  }
  .fw-btn:active { transform: scale(.92); }
  .fw-btn .dot {
    width: 14px; height: 14px; border-radius: 50%;
    box-shadow: 0 0 12px currentColor;
  }
  .fw-btn .name { font-size: 15px; letter-spacing: .18em; text-indent: .18em; font-weight: 600; }
  .fw-btn .hint { font-size: 10px; color: rgba(255,255,255,.55); letter-spacing: .1em; }
  .fw-btn[data-type="heart"] .dot { background: #57b6ff; color: #57b6ff; }
  .fw-btn[data-type="heart"] .name { color: #a8d8ff; }
  .fw-btn[data-type="star"]  .dot { background: #c07dff; color: #c07dff; }
  .fw-btn[data-type="star"]  .name { color: #dcb8ff; }
  .fw-btn[data-type="circle"] .dot { background: #f4f6ff; color: #f4f6ff; }
  .fw-btn[data-type="circle"] .name { color: #eef1ff; }

  /* ---------- 祝福语 ---------- */
  #blessing {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 7;
    pointer-events: none;
    opacity: 0;
    filter: blur(14px);
    transform: scale(1.06);
    transition: opacity 1.6s ease, filter 1.6s ease, transform 1.6s ease;
  }
  #blessing.show { opacity: 1; filter: blur(0); transform: scale(1); }
  #blessing .text {
    max-width: 86vw;
    text-align: center;
    font-size: clamp(20px, 5.6vw, 32px);
    line-height: 1.9;
    letter-spacing: .22em;
    text-indent: .22em;
    font-weight: 500;
    color: #fff8ea;
    text-shadow: 0 0 22px rgba(255, 214, 140, .6), 0 0 60px rgba(255, 190, 90, .35), 0 2px 10px rgba(0,0,0,.7);
  }
  #blessing .sub {
    margin-top: 22px;
    font-size: clamp(12px, 3.4vw, 15px);
    letter-spacing: .5em;
    text-indent: .5em;
    color: rgba(255, 236, 200, .8);
    text-shadow: 0 1px 6px rgba(0,0,0,.6);
  }
  #againBtn {
    margin-top: 46px;
    pointer-events: auto;
    border: 1px solid rgba(255, 226, 170, .5);
    background: rgba(30, 26, 52, .4);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    color: #ffe9bd;
    font-size: 14px;
    letter-spacing: .3em;
    text-indent: .3em;
    padding: 11px 30px;
    border-radius: 999px;
    cursor: pointer;
    opacity: 0;
    transition: opacity 1s ease .8s, transform .15s ease;
  }
  #blessing.show #againBtn { opacity: 1; }
  #againBtn:active { transform: scale(.93); }

  /* 暗角，增强氛围 */
  #vignette {
    position: fixed; inset: 0; z-index: 4; pointer-events: none;
    background: radial-gradient(ellipse at 50% 42%, transparent 55%, rgba(2,3,12,.55) 100%);
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="vignette"></div>

<div id="title">
  <h1>月满中秋</h1>
  <p>夜色温柔 · 万事胜意</p>
</div>

<div id="controls">
  <div id="picker">
    <button class="fw-btn" data-type="heart">
      <span class="dot"></span><span class="name">蔚蓝心悦</span><span class="hint">蓝色 · 爱心</span>
    </button>
    <button class="fw-btn" data-type="star">
      <span class="dot"></span><span class="name">紫星蜜语</span><span class="hint">紫色 · 五角星</span>
    </button>
    <button class="fw-btn" data-type="circle">
      <span class="dot"></span><span class="name">皓月银辉</span><span class="hint">银白 · 圆月</span>
    </button>
  </div>
  <button id="launchBtn">🎆 放烟花</button>
</div>

<div id="blessing">
  <div class="text" id="blessText"></div>
  <div class="sub">—— 中秋快乐 · 人间团圆 ——</div>
  <button id="againBtn">✨ 再赏一轮 ✨</button>
</div>

<script>
(function () {
  'use strict';

  /* ================= 基础工具 ================= */
  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0, DPR = 1;

  const rand = (a, b) => a + Math.random() * (b - a);
  const TAU = Math.PI * 2;

  /* ================= 烟花类型配置 ================= */
  const TYPES = {
    heart:  { palette: ['#4db2ff', '#7ec8ff', '#a5dcff', '#2f8fe0', '#cfeaff'] },
    star:   { palette: ['#c07dff', '#a44df0', '#dcb8ff', '#8a2be2', '#e9d1ff'] },
    circle: { palette: ['#ffffff', '#eef1ff', '#dfe6ff', '#fffbe8', '#cfd9ff'] }
  };

  /* ================= 祝福语 ================= */
  const BLESSINGS = [
    '愿你所念皆如愿<br>所行皆坦途，所遇皆温柔',
    '月光所照，皆是故乡<br>愿你眼里有光，心中有暖',
    '月圆人团圆<br>愿你岁岁常欢愉，年年皆胜意',
    '山河远阔，人间烟火<br>愿你被这世界温柔以待',
    '花好月圆夜<br>愿所有美好都如期而至'
  ];

  /* ================= 场景状态 ================= */
  let stars = [];        // 星星
  let buildings = [];    // 城市剪影
  let windows = [];      // 亮灯窗口
  let shootingStars = [];// 流星
  let rockets = [];      // 上升的烟花弹
  let particles = [];    // 爆炸粒子
  let flashes = [];      // 爆炸光晕
  let mode = 'idle';     // idle | show | frozen
  let showStart = 0;
  let frozen = false;    // 定格标志
  let shake = 0;         // 轻微镜头震动
  const SHOW_DURATION = 5000; // 烟花总时长 5 秒
  let currentType = 'heart';

  /* ================= 尺寸 & 场景生成 ================= */
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    buildSkyline();
  }

  function buildSkyline() {
    stars = [];
    const starCount = Math.floor(W * H / 4200);
    for (let i = 0; i < starCount; i++) {
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H * 0.62,
        r: rand(0.4, 1.5),
        base: rand(0.25, 0.9),
        speed: rand(0.0006, 0.0022),
        phase: Math.random() * TAU
      });
    }

    // 远景 + 近景两层楼群
    buildings = [];
    windows = [];
    const layers = [
      { hMin: H * 0.10, hMax: H * 0.22, color: '#0d1230', winChance: 0.10, winColor: 'rgba(255,214,130,0.5)', yBase: H },
      { hMin: H * 0.16, hMax: H * 0.34, color: '#070a1e', winChance: 0.16, winColor: 'rgba(255,206,110,0.85)', yBase: H }
    ];
    layers.forEach((L, li) => {
      let x = -10;
      while (x < W + 20) {
        const bw = rand(26, 70);
        const bh = rand(L.hMin, L.hMax);
        const b = { x, w: bw, h: bh, y: L.yBase - bh, layer: li };
        buildings.push(b);
        // 亮灯窗口
        const cols = Math.max(1, Math.floor(bw / 14));
        const rows = Math.max(1, Math.floor(bh / 18));
        for (let c = 0; c < cols; c++) {
          for (let r = 0; r < rows; r++) {
            if (Math.random() < L.winChance) {
              windows.push({
                x: b.x + 4 + c * (bw - 8) / cols,
                y: b.y + 6 + r * (bh - 10) / rows,
                w: 4, h: 6,
                color: L.winColor,
                flicker: Math.random() < 0.15,
                speed: rand(0.002, 0.01),
                phase: Math.random() * TAU,
                base: rand(0.5, 1)
              });
            }
          }
        }
        x += bw + rand(2, 10);
      }
    });
  }

  window.addEventListener('resize', resize);
  resize();

  /* ================= 月亮 ================= */
  function drawMoon(t) {
    const mx = W * 0.74, my = H * 0.17, mr = Math.min(W, H) * 0.105;
    // 光晕
    const glow = ctx.createRadialGradient(mx, my, mr * 0.4, mx, my, mr * 4.2);
    glow.addColorStop(0, 'rgba(255,244,214,0.32)');
    glow.addColorStop(0.4, 'rgba(255,238,190,0.12)');
    glow.addColorStop(1, 'rgba(255,238,190,0)');
    ctx.fillStyle = glow;
    ctx.fillRect(mx - mr * 4.2, my - mr * 4.2, mr * 8.4, mr * 8.4);
    // 月盘
    const body = ctx.createRadialGradient(mx - mr * 0.3, my - mr * 0.3, mr * 0.1, mx, my, mr);
    body.addColorStop(0, '#fffdf4');
    body.addColorStop(0.8, '#ffedc2');
    body.addColorStop(1, '#f7d894');
    ctx.beginPath();
    ctx.arc(mx, my, mr, 0, TAU);
    ctx.fillStyle = body;
    ctx.fill();
    // 环形山
    ctx.save();
    ctx.beginPath();
    ctx.arc(mx, my, mr, 0, TAU);
    ctx.clip();
    ctx.fillStyle = 'rgba(214,180,120,0.22)';
    [[-0.3,-0.15,0.22],[0.25,0.2,0.16],[-0.05,0.4,0.12],[0.45,-0.3,0.1],[-0.5,0.3,0.09]].forEach(c => {
      ctx.beginPath();
      ctx.arc(mx + c[0] * mr, my + c[1] * mr, c[2] * mr, 0, TAU);
      ctx.fill();
    });
    ctx.restore();
  }

  /* ================= 城堡剪影（迪士尼风格） ================= */
  function drawCastle() {
    const cx = W * 0.5;
    const base = H;
    const u = H / 120; // 比例单位，城堡需高过前景楼群
    ctx.fillStyle = '#05071a';
    ctx.beginPath();
    // 主墙
    ctx.rect(cx - 20 * u, base - 16 * u, 40 * u, 16 * u);
    // 侧墙
    ctx.rect(cx - 30 * u, base - 10 * u, 10 * u, 10 * u);
    ctx.rect(cx + 20 * u, base - 10 * u, 10 * u, 10 * u);
    // 中央高塔
    ctx.rect(cx - 6 * u, base - 34 * u, 12 * u, 34 * u);
    // 尖顶(三角形)
    spire(cx, base - 34 * u, 6 * u, 12 * u);
    spire(cx - 25 * u, base - 10 * u, 5 * u, 9 * u);
    spire(cx + 25 * u, base - 10 * u, 5 * u, 9 * u);
    // 小塔楼
    ctx.rect(cx - 16 * u, base - 24 * u, 6 * u, 24 * u);
    ctx.rect(cx + 10 * u, base - 24 * u, 6 * u, 24 * u);
    spire(cx - 13 * u, base - 24 * u, 4 * u, 8 * u);
    spire(cx + 13 * u, base - 24 * u, 4 * u, 8 * u);
    ctx.fill();

    function spire(x, y, halfW, h) {
      ctx.moveTo(x - halfW, y);
      ctx.lineTo(x, y - h);
      ctx.lineTo(x + halfW, y);
    }

    // 城堡亮灯小窗
    ctx.fillStyle = 'rgba(255,210,120,0.9)';
    [[0, -28, 1.4], [-4, -20, 1], [4, -20, 1], [-13, -18, 0.9], [13, -18, 0.9], [0, -10, 1.2]].forEach(w => {
      ctx.fillRect(cx + w[0] * u - w[2] * u / 2, base + w[1] * u, w[2] * u, w[2] * u * 1.5);
    });
  }

  /* ================= 背景绘制 ================= */
  function drawBackground(t) {
    // 夜空渐变
    const sky = ctx.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, '#04061a');
    sky.addColorStop(0.45, '#0a1030');
    sky.addColorStop(0.78, '#1a1f4a');
    sky.addColorStop(1, '#252a5c');
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, H);

    // 星星
    stars.forEach(s => {
      const a = s.base * (0.55 + 0.45 * Math.sin(t * s.speed + s.phase));
      ctx.globalAlpha = a;
      ctx.fillStyle = '#dfe8ff';
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, TAU);
      ctx.fill();
    });
    ctx.globalAlpha = 1;

    // 流星
    if (Math.random() < 0.003 && shootingStars.length < 2) {
      shootingStars.push({ x: rand(W * 0.1, W * 0.9), y: rand(0, H * 0.2), vx: rand(4, 7) * (Math.random() < 0.5 ? 1 : -1), vy: rand(2, 3.5), life: 1 });
    }
    shootingStars = shootingStars.filter(s => s.life > 0);
    shootingStars.forEach(s => {
      s.x += s.vx; s.y += s.vy; s.life -= 0.02;
      const g = ctx.createLinearGradient(s.x, s.y, s.x - s.vx * 8, s.y - s.vy * 8);
      g.addColorStop(0, 'rgba(255,255,255,' + (0.8 * s.life) + ')');
      g.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.strokeStyle = g;
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.moveTo(s.x, s.y);
      ctx.lineTo(s.x - s.vx * 8, s.y - s.vy * 8);
      ctx.stroke();
    });

    drawMoon(t);

    // 远景楼群
    ctx.fillStyle = '#0d1230';
    buildings.forEach(b => { if (b.layer === 0) ctx.fillRect(b.x, b.y, b.w, b.h); });
    // 近景楼群
    ctx.fillStyle = '#070a1e';
    buildings.forEach(b => { if (b.layer === 1) ctx.fillRect(b.x, b.y, b.w, b.h); });

    // 亮灯窗口
    windows.forEach(w => {
      let a = w.base;
      if (w.flicker) a *= 0.5 + 0.5 * Math.sin(t * w.speed * 8 + w.phase);
      ctx.globalAlpha = a;
      ctx.fillStyle = w.color;
      ctx.fillRect(w.x, w.y, w.w, w.h);
    });
    ctx.globalAlpha = 1;

    drawCastle();
  }

  /* ================= 烟花：形状采样 ================= */
  function shapePoint(type) {
    if (type === 'heart') {
      const t = Math.random() * TAU;
      const hx = 16 * Math.pow(Math.sin(t), 3);
      const hy = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
      // 心形内部也填充一些，更饱满
      const fill = Math.random() < 0.15 ? Math.random() * 0.4 : (0.92 + Math.random() * 0.1);
      return { x: hx * fill / 16, y: hy * fill / 16 };
    }
    if (type === 'star') {
      const spikes = 5;
      const t = Math.random() * TAU;
      // 五角星轮廓: r(θ) 分段
      const seg = ((t % (TAU / spikes)) / (TAU / spikes));
      const r = seg < 0.5 ? 1 - seg * 1.2 : 0.4 + (seg - 0.5) * 1.2; // 尖角在扇区边界
      const fill = Math.random() < 0.15 ? Math.random() * 0.35 : (0.92 + Math.random() * 0.1);
      return { x: Math.cos(t - Math.PI / 2) * r * fill, y: Math.sin(t - Math.PI / 2) * r * fill };
    }
    // 圆形
    const a = Math.random() * TAU;
    const ring = Math.random() < 0.3 ? Math.random() * 0.5 : (0.9 + Math.random() * 0.15);
    return { x: Math.cos(a) * ring, y: Math.sin(a) * ring };
  }

  /* ================= 烟花弹（上升） ================= */
  function launchRocket(delay) {
    const cx = W / 2;
    setTimeout(() => {
      if (mode !== 'show') return;
      const targetX = rand(W * 0.15, W * 0.85);
      const targetY = rand(H * 0.14, H * 0.42);
      rockets.push({
        x: cx + rand(-W * 0.06, W * 0.06),
        y: H,
        vx: (targetX - cx) / 70,
        vy: -(H - targetY) / 70 - rand(0.5, 1.5),
        targetY,
        color: TYPES[currentType].palette[0],
        trail: []
      });
    }, delay);
  }

  function explode(x, y) {
    const palette = TYPES[currentType].palette;
    const size = Math.min(W, H) * rand(0.16, 0.22);
    const count = currentType === 'circle' ? 170 : 160;
    flashes.push({ x, y, r: size * 0.5, alpha: 0.9, color: palette[0] });
    shake = Math.min(shake + 3, 7);
    for (let i = 0; i < count; i++) {
      const p = shapePoint(currentType);
      particles.push({
        x, y,
        tx: x + p.x * size * 1.35,
        ty: y + p.y * size * 1.35,
        progress: 0,
        dur: rand(1400, 2100),
        size: rand(1.2, 2.6),
        color: palette[Math.floor(Math.random() * palette.length)],
        twinkle: currentType === 'circle' ? Math.random() < 0.7 : Math.random() < 0.25,
        twSpeed: rand(0.01, 0.03),
        delay: Math.random() * 120
      });
    }
  }

  /* ================= 主循环 ================= */
  let lastT = performance.now();
  function loop(now) {
    const t = now;
    const frozenNow = frozen;

    ctx.save();
    if (shake > 0.1 && !frozenNow) {
      ctx.translate(rand(-shake, shake), rand(-shake, shake));
      shake *= 0.88;
    }

    drawBackground(t);

    if (!frozenNow) {
      // 上升中的烟花弹
      rockets = rockets.filter(r => {
        r.trail.push({ x: r.x, y: r.y, life: 1 });
        if (r.trail.length > 14) r.trail.shift();
        r.x += r.vx;
        r.y += r.vy;
        r.vy *= 0.985;
        r.trail.forEach(p => p.life -= 0.07);
        r.trail = r.trail.filter(p => p.life > 0);

        r.trail.forEach(p => {
          ctx.globalAlpha = p.life * 0.6;
          ctx.fillStyle = r.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, 1.6 * p.life, 0, TAU);
          ctx.fill();
        });
        ctx.globalAlpha = 1;
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(r.x, r.y, 2.2, 0, TAU);
        ctx.fill();

        if (r.y <= r.targetY || r.vy > -1) {
          explode(r.x, r.y);
          return false;
        }
        return true;
      });

      // 爆炸光晕
      flashes = flashes.filter(f => f.alpha > 0.02);
      flashes.forEach(f => {
        f.alpha *= 0.86;
        ctx.globalAlpha = f.alpha * 0.25;
        const gg = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.r * 2.2);
        gg.addColorStop(0, f.color);
        gg.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = gg;
        ctx.beginPath();
        ctx.arc(f.x, f.y, f.r * 2.2, 0, TAU);
        ctx.fill();
      });
      ctx.globalAlpha = 1;

      // 爆炸粒子
      ctx.globalCompositeOperation = 'lighter';
      particles = particles.filter(p => p.progress < 1);
      particles.forEach(p => {
        if (p.delay > 0) { p.delay -= 16; return; }
        p.progress += 16 / p.dur;
        const e = 1 - Math.pow(1 - Math.min(p.progress, 1), 3); // easeOutCubic
        const px = p.x + (p.tx - p.x) * e;
        const py = p.y + (p.ty - p.y) * e + 16 * p.progress * p.progress; // 轻微下坠
        let a = 1 - p.progress;
        if (p.twinkle) a *= 0.45 + 0.55 * Math.abs(Math.sin(t * p.twSpeed + p.tx));
        ctx.globalAlpha = Math.max(a, 0);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(px, py, p.size, 0, TAU);
        ctx.fill();
      });
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
    } else {
      // 定格：重绘最后一帧粒子（保持静止的微光）
      ctx.globalCompositeOperation = 'lighter';
      particles.forEach(p => {
        if (p.delay > 0) return; // 定格时未出场的粒子不画
        const e = 1 - Math.pow(1 - Math.min(p.progress, 1), 3);
        const px = p.x + (p.tx - p.x) * e;
        const py = p.y + (p.ty - p.y) * e + 16 * p.progress * p.progress;
        ctx.globalAlpha = Math.max(0.55 * (1 - p.progress) + 0.12, 0.1);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(px, py, p.size, 0, TAU);
        ctx.fill();
      });
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
    }

    ctx.restore();

    // 5 秒定格：最后一发大烟花
    if (mode === 'show' && !frozenNow && t - showStart >= SHOW_DURATION) {
      frozen = true;
    }

    lastT = now;
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  /* ================= 交互流程 ================= */
  const controls = document.getElementById('controls');
  const picker = document.getElementById('picker');
  const launchBtn = document.getElementById('launchBtn');
  const blessing = document.getElementById('blessing');
  const blessText = document.getElementById('blessText');
  const againBtn = document.getElementById('againBtn');
  const title = document.getElementById('title');

  launchBtn.addEventListener('click', () => {
    picker.classList.toggle('open');
  });

  document.querySelectorAll('.fw-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      currentType = btn.dataset.type;
      startShow();
    });
  });

  function startShow() {
    mode = 'show';
    frozen = false;
    rockets = [];
    particles = [];
    flashes = [];
    shake = 0;
    showStart = performance.now();

    controls.classList.add('hidden');
    blessing.classList.remove('show');
    title.style.opacity = '0';

    // 5 秒内错落发射 7 发，最后一发大而居中
    for (let i = 0; i < 6; i++) launchRocket(i * 620);
    // 最后一发（第 5 秒）：大而居中，定格时最亮
    setTimeout(() => {
      if (mode !== 'show') return;
      rockets.push({
        x: W / 2, y: H, vx: 0, vy: -(H - H * 0.3) / 60 - 2,
        targetY: H * 0.3, color: TYPES[currentType].palette[0], trail: [], grand: true
      });
    }, 3900);

    // 定格后 400ms 丝滑浮现祝福语
    setTimeout(() => {
      if (mode !== 'show') return;
      blessText.innerHTML = BLESSINGS[Math.floor(Math.random() * BLESSINGS.length)];
      blessing.classList.add('show');
    }, SHOW_DURATION + 400);
  }

  againBtn.addEventListener('click', () => {
    mode = 'idle';
    frozen = false;
    particles = [];
    rockets = [];
    flashes = [];
    blessing.classList.remove('show');
    controls.classList.remove('hidden');
    picker.classList.remove('open');
    title.style.opacity = '1';
  });

  // 调试入口：#auto-heart / #auto-star / #auto-circle 自动播放
  const auto = location.hash.match(/^#auto-(heart|star|circle)$/);
  if (auto) setTimeout(() => { currentType = auto[1]; startShow(); }, 400);
  // 调试：#freeze-heart 等，加载即定格一发烟花用于截图验证形状
  const frz = location.hash.match(/^#freeze-(heart|star|circle)$/);
  if (frz) {
    currentType = frz[1];
    explode(W * 0.5, H * 0.32);
    particles.forEach(p => { p.progress = rand(0.75, 0.9); p.delay = 0; });
    frozen = true;
  }
})();
</script>
</body>
